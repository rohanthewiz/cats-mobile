# Dart pub workspace root. Not a package anyone depends on — it exists so the
# protocol package and the Flutter app share one resolved dependency set and one
# `dart pub get`. Dart 3.10 supports this natively, which is why there is no
# melos here.
name: _cats_mobile_workspace
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/catsproto
  # - packages/cats_mobile   # the Flutter app; added when it lands
